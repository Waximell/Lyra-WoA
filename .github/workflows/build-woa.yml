name: Windows ARM64

# Builds a Windows-on-ARM (win-arm64) Lyra bundle from source on GitHub's native
# ARM64 runner (windows-11-arm) - no cross-compilation, no local toolchain needed.
#
#   probe  - cheap sanity check that the NuGet-supplied native DLLs ship a win-arm64 RID
#   native - vcpkg + CMake build of native/*Wrapper and every dependency DLL
#   app    - dotnet publish, stage lib/Windows, verify, zip

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-woa.yml'
      - 'ci/**'

concurrency:
  group: woa-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
  TRIPLET: arm64-windows-release

jobs:
  probe:
    name: probe NuGet natives
    runs-on: windows-11-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: dotnet --info
        shell: pwsh
        run: dotnet --info

      - name: Stage NuGet-provided natives for win-arm64
        shell: pwsh
        run: ./ci/fetch-nuget-natives.ps1 -OutDir ci-probe-dist

      - name: Check they are really ARM64 PE files
        shell: pwsh
        run: |
          ./ci/verify-package.ps1 -Dir ci-probe-dist -ExpectMachine arm64 `
            -Required SDL3.dll,libSkiaSharp.dll,libHarfBuzzSharp.dll

  native:
    name: build native wrappers
    runs-on: windows-11-arm
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Report runner / vcpkg
        shell: pwsh
        run: |
          Write-Host "runner arch: $env:PROCESSOR_ARCHITECTURE"
          $v = if ($env:VCPKG_INSTALLATION_ROOT) { $env:VCPKG_INSTALLATION_ROOT } else { 'C:\vcpkg' }
          Write-Host "vcpkg root: $v"
          if (Test-Path "$v\vcpkg.exe") { & "$v\vcpkg.exe" version }
          cmake --version
          git -C "$v" log -1 --format='vcpkg baseline: %H' 2>$null

      # vcpkg has no usable remote cache for our custom triplet, so keep the binary
      # cache between runs: a green native job then becomes a ~2 minute no-op.
      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}\.vcpkg-binary-cache
          key: vcpkg-${{ env.TRIPLET }}-${{ hashFiles('ci/build-native.ps1', 'ci/triplets/*.cmake') }}
          restore-keys: |
            vcpkg-${{ env.TRIPLET }}-

      - name: Build wrappers and dependency DLLs
        shell: pwsh
        env:
          VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.vcpkg-binary-cache,readwrite
        run: ./ci/build-native.ps1 -Triplet $env:TRIPLET -Arch ARM64

      - name: Collect build logs on failure
        if: failure()
        shell: pwsh
        run: |
          $logs = Get-ChildItem build -Recurse -Filter *.log -File -ErrorAction SilentlyContinue
          Write-Host "log files: $($logs.Count)"
          $logs | Select-Object -First 40 | ForEach-Object {
            Write-Host "===== $($_.FullName)"
            Get-Content $_.FullName -Tail 120
          }

      - uses: actions/upload-artifact@v4
        with:
          name: native-dlls
          path: release/native/dist-windows
          if-no-files-found: error
          retention-days: 14

  app:
    name: publish win-arm64 bundle
    needs: native
    runs-on: windows-11-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Fetch native DLLs from the native job
        uses: actions/download-artifact@v4
        with:
          name: native-dlls
          path: release/native/dist-windows

      - name: List staged natives
        shell: pwsh
        run: |
          Get-ChildItem release/native/dist-windows -File |
            Sort-Object Name | ForEach-Object { '{0,-28} {1,8:N2} MB' -f $_.Name, ($_.Length/1MB) }

      - name: Provide release/VERSION
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release -Force | Out-Null
          Set-Content release/VERSION '0.6.0' -NoNewline -Encoding utf8
          Write-Host "VERSION=$(Get-Content release/VERSION)"

      - name: Stage NuGet-provided natives for win-arm64
        shell: pwsh
        run: ./ci/fetch-nuget-natives.ps1 -OutDir release/native/dist-windows

      - name: dotnet publish (self-contained single file)
        shell: pwsh
        run: |
          dotnet publish Lyra.Core/Lyra.Core.csproj `
            -c Release `
            -r win-arm64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=none `
            -p:PublishReadyToRun=false `
            -o out/publish
          if ($LASTEXITCODE -ne 0) { throw "dotnet publish failed ($LASTEXITCODE)" }

      - name: Stage lib/Windows next to the app
        shell: pwsh
        run: |
          # Directory.Build.targets only copies these into bin/, never into publish/.
          $dst = 'out/publish/lib/Windows'
          New-Item -ItemType Directory -Path $dst -Force | Out-Null
          Copy-Item release/native/dist-windows/* $dst -Force
          # One copy is enough: keep the arch-correct SDL3 next to the others.
          Remove-Item out/publish/SDL3.dll -Force -ErrorAction SilentlyContinue
          Get-ChildItem $dst -File | Measure-Object -Property Length -Sum |
            ForEach-Object { 'lib/Windows: {0} files, {1:N1} MB' -f $_.Count, ($_.Sum/1MB) }

      - name: Verify the bundle
        shell: pwsh
        run: ./ci/verify-package.ps1 -Dir out/publish -ExpectMachine arm64

      - name: Zip
        shell: pwsh
        run: |
          $zip = 'LyraViewer-windows-arm64.zip'
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path out/publish/* -DestinationPath $zip -CompressionLevel Optimal
          '{0} -> {1:N1} MB' -f $zip, ((Get-Item $zip).Length/1MB)

      - uses: actions/upload-artifact@v4
        with:
          name: LyraViewer-windows-arm64
          path: LyraViewer-windows-arm64.zip
          if-no-files-found: error
          retention-days: 30
