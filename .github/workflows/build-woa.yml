name: Windows ARM64

# Builds a Windows-on-ARM (win-arm64) Lyra bundle from source on GitHub's native
# ARM64 runner (windows-11-arm) - no cross-compilation, no local toolchain needed.
#
#   probe  - cheap sanity check that the NuGet-supplied native DLLs ship a win-arm64 RID
#   native - vcpkg + CMake build of native/*Wrapper and every dependency DLL
#   app    - dotnet publish, stage lib/Windows, verify, zip

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-woa.yml'
      - 'ci/**'
      - 'packaging/**'

concurrency:
  group: woa-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
  TRIPLET: arm64-windows-release

jobs:
  probe:
    name: probe NuGet natives
    runs-on: windows-11-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: dotnet --info
        shell: pwsh
        run: dotnet --info

      - name: Stage NuGet-provided natives for win-arm64
        shell: pwsh
        run: ./ci/fetch-nuget-natives.ps1 -OutDir ci-probe-dist

      - name: Check they are really ARM64 PE files
        shell: pwsh
        run: |
          ./ci/verify-package.ps1 -Dir ci-probe-dist -ExpectMachine arm64 `
            -Required SDL3.dll,libSkiaSharp.dll,libHarfBuzzSharp.dll

  native:
    name: build native wrappers
    runs-on: windows-11-arm
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Report runner / vcpkg
        shell: pwsh
        run: |
          Write-Host "runner arch: $env:PROCESSOR_ARCHITECTURE"
          $v = if ($env:VCPKG_INSTALLATION_ROOT) { $env:VCPKG_INSTALLATION_ROOT } else { 'C:\vcpkg' }
          Write-Host "vcpkg root: $v"
          if (Test-Path "$v\vcpkg.exe") { & "$v\vcpkg.exe" version }
          cmake --version
          git -C "$v" log -1 --format='vcpkg baseline: %H' 2>$null

      # vcpkg has no usable remote cache for our custom triplet, so keep the binary
      # cache between runs: a green native job then becomes a ~2 minute no-op.
      # Key deliberately excludes the wrapper build script, so editing ci/build-native.ps1
      # does not throw away 60+ minutes of compiled dependencies.
      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}\.vcpkg-binary-cache
          key: vcpkg-${{ env.TRIPLET }}-${{ hashFiles('ci/triplets/*.cmake') }}-ports-v1
          restore-keys: |
            vcpkg-${{ env.TRIPLET }}-

      - name: Build wrappers and dependency DLLs
        shell: pwsh
        env:
          VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.vcpkg-binary-cache,readwrite
        run: ./ci/build-native.ps1 -Triplet $env:TRIPLET -Arch ARM64

      - name: Collect build logs on failure
        if: failure()
        shell: pwsh
        run: |
          $logs = Get-ChildItem build -Recurse -Filter *.log -File -ErrorAction SilentlyContinue
          Write-Host "log files: $($logs.Count)"
          $logs | Select-Object -First 40 | ForEach-Object {
            Write-Host "===== $($_.FullName)"
            Get-Content $_.FullName -Tail 120
          }

      - uses: actions/upload-artifact@v4
        with:
          name: native-dlls
          path: release/native/dist-windows
          if-no-files-found: error
          retention-days: 14

  app:
    name: publish win-arm64 bundle
    needs: native
    runs-on: windows-11-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Fetch native DLLs from the native job
        uses: actions/download-artifact@v4
        with:
          name: native-dlls
          path: release/native/dist-windows

      - name: List staged natives
        shell: pwsh
        run: |
          Get-ChildItem release/native/dist-windows -File |
            Sort-Object Name | ForEach-Object { '{0,-28} {1,8:N2} MB' -f $_.Name, ($_.Length/1MB) }

      - name: Provide release/VERSION
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release -Force | Out-Null
          Set-Content release/VERSION '0.6.0' -NoNewline -Encoding utf8
          Write-Host "VERSION=$(Get-Content release/VERSION)"

      - name: Stage NuGet-provided natives for win-arm64
        shell: pwsh
        run: ./ci/fetch-nuget-natives.ps1 -OutDir release/native/dist-windows

      - name: dotnet publish (self-contained single file)
        shell: pwsh
        run: |
          dotnet publish Lyra.Core/Lyra.Core.csproj `
            -c Release `
            -r win-arm64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=none `
            -p:PublishReadyToRun=false `
            -o out/publish
          if ($LASTEXITCODE -ne 0) { throw "dotnet publish failed ($LASTEXITCODE)" }

      - name: Stage lib/Windows next to the app
        shell: pwsh
        run: |
          # Directory.Build.targets only copies these into bin/, never into publish/.
          $dst = 'out/publish/lib/Windows'
          New-Item -ItemType Directory -Path $dst -Force | Out-Null
          Copy-Item release/native/dist-windows/* $dst -Force
          # One copy is enough: keep the arch-correct SDL3 next to the others.
          Remove-Item out/publish/SDL3.dll -Force -ErrorAction SilentlyContinue
          Get-ChildItem $dst -File | Measure-Object -Property Length -Sum |
            ForEach-Object { 'lib/Windows: {0} files, {1:N1} MB' -f $_.Count, ($_.Sum/1MB) }

      - name: Verify the bundle
        shell: pwsh
        run: ./ci/verify-package.ps1 -Dir out/publish -ExpectMachine arm64 -RequireExe

      - name: Zip
        shell: pwsh
        run: |
          $zip = 'LyraViewer-windows-arm64.zip'
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path out/publish/* -DestinationPath $zip -CompressionLevel Optimal
          '{0} -> {1:N1} MB' -f $zip, ((Get-Item $zip).Length/1MB)

      - uses: actions/upload-artifact@v4
        with:
          name: LyraViewer-windows-arm64
          path: LyraViewer-windows-arm64.zip
          if-no-files-found: error
          retention-days: 30

  # Packs the very same bundle into an MSIX. Runs on an x64 runner on purpose: the
  # package architecture lives in the manifest, so packing needs no ARM64 machine,
  # and the Windows SDK tools are guaranteed to be there.
  msix:
    name: package arm64 MSIX
    needs: app
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the published bundle
        uses: actions/download-artifact@v4
        with:
          name: LyraViewer-windows-arm64
          path: out/artifact

      - name: Expand the bundle
        shell: pwsh
        run: |
          $zip = Get-ChildItem out/artifact -Filter *.zip -Recurse | Select-Object -First 1
          if (-not $zip) { throw 'no bundle zip inside the artifact' }
          Expand-Archive $zip.FullName -DestinationPath out/publish -Force
          Get-ChildItem out/publish | Sort-Object Name |
            ForEach-Object { '{0,-28} {1,10:N2} MB' -f $_.Name, $(if ($_.PSIsContainer) { 0 } else { $_.Length/1MB }) }

      - name: Write the signing certificate
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.MSIX_PFX_BASE64 }}
        run: |
          $path = Join-Path $env:RUNNER_TEMP 'lyra-signing.pfx'
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:PFX_BASE64))
          "PFX_PATH=$path" >> $env:GITHUB_ENV

      - name: Pack and sign the MSIX
        shell: pwsh
        env:
          PFX_PASSWORD: ${{ secrets.MSIX_PFX_PASSWORD }}
        run: |
          ./ci/build-msix.ps1 `
            -PublishDir out/publish `
            -OutFile out/LyraViewer-windows-arm64.msix `
            -CertPath $env:PFX_PATH `
            -CertPassword $env:PFX_PASSWORD `
            -Version 0.6.0.0

      - uses: actions/upload-artifact@v4
        with:
          name: LyraViewer-windows-arm64-msix
          path: |
            out/LyraViewer-windows-arm64.msix
            packaging/msix/waximell-selfsigned.cer
          if-no-files-found: error
          retention-days: 30

  # Publishes both artifacts as a GitHub Release, so the .msix can be installed
  # straight from the release page.
  release:
    name: publish release
    needs: [app, msix]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      TAG: v0.6.0-woa
    steps:
      - name: Fetch artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: List assets
        run: find dist -type f | sort

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          assets=(dist/**/*.zip dist/**/*.msix dist/**/*.cer)
          printf 'assets: %s\n' "${assets[@]}"
          cat > notes.md <<'EOF'
          此分发随上游 main 编译，版本 0.6.0。

          本仓库未对项目源码做实质调整，仅添加 CI 与 Workflow 并运行。

          MSIX 额外添加了 appExecutionAlias: Lyra（终端里 `lyra <文件>` 即可启动），与如下格式关联：
          .png .apng .jpg .jpeg .jpe .jfif .gif .webp .avif .heic .heif .bmp .ico .svg

          经初步测试，与上游行为未发现偏离。

          MSIX 签名为我自行生成的密钥，不保证私钥安全，非常不建议信任；如果有意使用本项目产物，请务必使用松散 zip。
          EOF
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --repo "$REPO" --clobber
          else
            gh release create "$TAG" "${assets[@]}" \
              --repo "$REPO" \
              --title "Lyra Viewer 0.6.0 (Windows ARM64)" \
              --notes-file notes.md
          fi
